# Configuração para deploy no Render.com (opcional — o painel também funciona sem este arquivo)
services:
  - type: web
    name: kazulo-workflow
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEFAULT_USER_PASSWORD
        sync: false
      - key: DB_PATH
        value: /var/data/kazulo.db
    disk:
      name: kazulo-sqlite
      mountPath: /var/data
      sizeGB: 1
