# Railway lê este arquivo automaticamente (opcional)
# Dados: crie Volume Mount Path /data + DB_PATH=/data/kazulo.db (docs/RAILWAY-PERSISTENCIA-DADOS.md)
[build]
buildCommand = "npm install && npm run build"

[deploy]
startCommand = "npm run start"
healthcheckPath = "/api/health"
restartPolicyType = "ON_FAILURE"
